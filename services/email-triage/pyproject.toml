[project]
name = "email-triage"
version = "0.1.0"
description = "Local Mac runner that triages Gmail via the local Gmail MCP server"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
    "supabase>=2.9.0",
]

[project.scripts]
triage = "triage.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage"]
