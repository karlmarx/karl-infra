[project]
name = "lawyer-outreach"
version = "0.1.0"
description = "Personalized outreach + intake automation for Truvada/TDF PrEP mass-tort firms"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "playwright>=1.47.0",
    "tenacity>=9.0.0",
]

[project.scripts]
outreach = "outreach.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outreach"]
